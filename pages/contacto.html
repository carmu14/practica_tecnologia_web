<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <!-- Está etiqueta indica al navegador como mostrar la página en celulares y tablets.
             width=device-width >> nos permite usar el ancho de la pantalla del dispositivo
             initial-scale = 1.0 >> nos ayuda a establecer el nivel de zoom inicial en su tamaño normal
        -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Sitio académico de Tecnologías Web: impacto social y empresarial, oportunidades y retos.">
        <title>Contacto | Impacto de las Tecnologías Web</title>
        <link rel="stylesheet" href="../css/estilos.css">
    </head>
    <body>
        <header>
            <p>Tecnologías Web · UTPL · Primer bimestre</p>
            <h1>Contacto</h1>
            <nav>
                <ul>
                    <!-- Uso ../ para salir de pages y volver a Inicio. -->
                    <li><a href="../index.html">Inicio</a></li>
                    <li><a href="sociedad.html">Sociedad</a></li>
                    <li><a href="negocios.html">Negocios</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                </ul>
            </nav>
        </header>
        <main>
            <section>
                <h2>Formulario de contacto</h2>
                <form method="get" autocomplete="off">
                    <!-- Sea grega cada campo dentro de su label para relacionarlo con su texto. -->
                    <p>
                        <label>
                            Nombre (2 a 80 caracteres)<br>
                            <input type="text" required minlength="2" maxlength="80">
                        </label>
                    </p>
                    <p>
                        <label>
                            Correo electrónico (máximo 120 caracteres)<br>
                            <input type="email" required maxlength="120">
                        </label>
                    </p>
                    <p>
                        <label>
                            Asunto (5 a 100 caracteres)<br>
                            <input type="text" required minlength="5" maxlength="100">
                        </label>
                    </p>
                    <p>
                        <label>
                            Mensaje (10 a 1500 caracteres)<br>
                            <textarea rows="6" cols="25" required minlength="10" maxlength="1500"></textarea>
                        </label>
                    </p>
                    <!-- Se agrega boton como referencia no hace ninguna acción. -->
                    <button type="button">ENVIAR</button>
                </form>
            </section>
        </main>
        <footer>
            <p>Actividad Práctica 1 · Trabajo académico sobre sociedad y negocios.</p>
            <a href="contacto.html">Contacto</a>
        </footer>
    </body>
</html>
